<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shared todo</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 24px 20px; font: 15px/1.5 var(--font-sans, system-ui, sans-serif);
         background: var(--color-background-primary, Canvas); color: var(--color-text-primary, CanvasText); }
  main { max-width: 34rem; margin: 0 auto; }
  p.said { margin: 0 0 16px; color: var(--color-text-secondary, GrayText); font-size: 13px; }
  ul { list-style: none; margin: 0; padding: 0; }
  li label { display: flex; gap: 12px; align-items: center; padding: 10px 4px; cursor: pointer; }
  li input { width: 18px; height: 18px; accent-color: var(--color-ring-primary, AccentColor); }
  li.done span { text-decoration: line-through; color: var(--color-text-secondary, GrayText); }
  form { display: flex; gap: 8px; margin-top: 12px; }
  form input { flex: 1; font: inherit; padding: 8px 10px; border-radius: 8px;
               border: 1px solid var(--color-border-primary, GrayText); background: transparent; color: inherit; }
  button { font: inherit; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--color-border-primary, GrayText);
           background: transparent; color: inherit; cursor: pointer; }
</style>
</head>
<body>
<main>
  <p class="said" id="said">Connecting…</p>
  <ul id="items"></ul>
  <form id="add"><input id="text" placeholder="Add an item" aria-label="Add an item"><button>Add</button></form>
</main>
<script>
// The MCP Apps protocol, by hand: JSON-RPC over postMessage to the host.
let id = 0, version = 0, data = {};
const waiting = new Map();
function request(method, params) {
  const i = ++id;
  parent.postMessage({ jsonrpc: "2.0", id: i, method, params }, "*");
  return new Promise((ok, fail) => waiting.set(i, { ok, fail }));
}
addEventListener("message", (e) => {
  const m = e.data || {};
  if (m.id && waiting.has(m.id) && !m.method) {
    const w = waiting.get(m.id); waiting.delete(m.id);
    m.error ? w.fail(new Error(m.error.message)) : w.ok(m.result);
  } else if (m.method === "ui/notifications/host-context-changed") style(m.params);
});
function style(ctx) {
  const fonts = ctx?.styles?.css?.fonts;
  if (fonts && !document.getElementById("host-fonts")) {
    const s = document.createElement("style"); s.id = "host-fonts"; s.textContent = fonts; document.head.append(s);
  }
  for (const [k, v] of Object.entries(ctx?.styles?.variables || {})) if (v) document.documentElement.style.setProperty(k, v);
  if (ctx?.theme) document.documentElement.style.colorScheme = ctx.theme;
}
async function call(name, args) {
  const r = await request("tools/call", { name, arguments: args });
  if (r.isError) throw new Error((r.content || []).map((c) => c.text).join(" "));
  return r.structuredContent;
}
function take(d) {
  version = d.version; data = d.data;
  draw(d.by);
}
function draw(by) {
  const items = Object.entries(data.items || {}).sort(([, a], [, b]) => (a.at || 0) - (b.at || 0));
  document.getElementById("items").replaceChildren(...items.map(([key, it]) => {
    const li = document.createElement("li");
    li.className = it.done ? "done" : "";
    li.dataset.key = key;
    const box = Object.assign(document.createElement("input"), { type: "checkbox", checked: !!it.done });
    box.onchange = () => call("page_data_change", { patch: { items: { [key]: { done: box.checked } } } }).then(take);
    const label = document.createElement("label");
    label.append(box, Object.assign(document.createElement("span"), { textContent: it.text }));
    li.append(label);
    return li;
  }));
  const left = items.filter(([, it]) => !it.done).length;
  document.getElementById("said").textContent = `${left} of ${items.length} left` + (by ? ` · last changed by ${by === "person" ? "you" : "the agent"}` : "");
}
document.getElementById("add").onsubmit = (e) => {
  e.preventDefault();
  const text = document.getElementById("text").value.trim();
  if (!text) return;
  document.getElementById("text").value = "";
  const key = Date.now().toString(36);
  call("page_data_change", { patch: { items: { [key]: { text, done: false, at: Date.now() } } } }).then(take);
};
(async () => {
  const init = await request("ui/initialize", { appInfo: { name: "Shared todo", version: "1" }, appCapabilities: {}, protocolVersion: "2026-01-26" });
  style(init.hostContext);
  parent.postMessage({ jsonrpc: "2.0", method: "ui/notifications/initialized", params: {} }, "*");
  take(await call("page_data", {}));
  // Live: each watch answers once the data moves past what this page has.
  for (;;) {
    try { const d = await call("page_data_watch", { since: version }); if (d.version !== version) take(d); }
    catch { await new Promise((r) => setTimeout(r, 2000)); }
  }
})();
</script>
</body>
</html>
