[package]
name = "libri"
version = "0.9.85"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
async-trait = "0.1"
# Only to hand rmcp the responses its OAuth client trait speaks in.
http = "1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "tokio"] }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "cache", "fallible_uint"] }
rmcp = { version = "3.5", default-features = false, features = [
    "client",
    "macros",
    "server",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
    "auth",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "2"
ring = "0.17"
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
ureq = { version = "3", default-features = false, features = ["json", "rustls"] }
mail-parser = "0.11.9"
webpki-roots = "1.0.9"
axum = { version = "0.8", features = ["multipart", "ws"] }
futures-util = "0.3"
getrandom = "0.4"
libc = "0.2"
tower-http = { version = "0.6", features = ["fs", "set-header"] }
tower-layer = "0.3"
web-push-native = "0.5"
# The terminal: Ghostty keeps each shell's screen on the host, so a device
# that reconnects gets the screen as it is, not a replay of raw output.
# Linked from the library nix/libghostty-vt.nix builds, found by pkg-config.
libghostty-vt = { version = "0.2.2", default-features = false }
libghostty-vt-sys = { version = "0.2.2", default-features = false, features = ["pkg-config"] }
portable-pty = "0.9"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Local speech to text (stt.rs), linked against the shared C API that
# nix/rust-tool.nix names from nixpkgs' sherpa-onnx. Pinned to that release,
# whose C API the crate's bindings match; move both together.
sherpa-onnx = { version = "=1.13.8", default-features = false, features = ["shared"], optional = true }

[features]
default = ["local-speech"]
# The local speech engine. The static release bundle builds without it, as
# sherpa-onnx comes only as a shared library; it offers the cloud choices.
local-speech = ["dep:sherpa-onnx"]

[profile.release]
lto = "thin"
strip = true
